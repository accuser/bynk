name: Deploy the docs site (Cloudflare Pages)

# Slice 1 of the documentation track (ADR 0141). Builds the Astro/Starlight site
# and uploads the static dist/ to the bynk-lang.org apex Pages project. The build
# runs here, where the toolchain lives; Cloudflare only serves the static output.
#
# Gated on a GREEN CI run, not on the push itself. This used to trigger straight
# off `push: branches: [main]`, independent of ci.yml, so the site published from
# `main` whether or not its suite passed — and `main` failed CI in ~17% of recent
# runs. `astro build` re-runs here, so a site that does not BUILD cannot ship;
# what leaked through was a commit that builds with a red test suite.
#
# `workflow_run` accepts no path filters, so the "did anything I care about
# change?" decision moved into the `decide` job, where it is stated ONCE rather
# than duplicated between trigger and job.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual run — the first deploy (after the Pages project + DNS exist) and any
  # redeploy without a code change.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; don't cancel an in-progress one.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  # See deploy-playground.yml for why this is a separate job: it gates the whole
  # expensive build once, instead of every step carrying its own `if:`.
  decide:
    name: Should we deploy?
    # Three conditions, not one. `conclusion == 'success'` is the CI gate this
    # workflow exists for; the other two are what make the checkout below safe —
    # without them a pull request from any fork's `main` reached the trigger and
    # got its code built in a job holding the Cloudflare deploy token. The long
    # note is in deploy-playground.yml, which carries the identical guard; the two
    # must move together.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.changed.outputs.value }}
      sha: ${{ steps.changed.outputs.sha }}
    steps:
      # The paths worth a redeploy — the single copy of the list that used to
      # live in `on.push.paths`.
      #
      # `**/src/**/*.rs` + the manifests are here because the crate API docs
      # (/docs/api/) are generated from the Rust source during this deploy. That
      # does mean most Rust merges rebuild the whole site; splitting the rustdoc
      # refresh into its own job would fix that, and is deliberately left alone
      # here so this change stays about the CI gate.
      #
      # The file list comes from the commits API rather than `git diff HEAD^ HEAD`
      # over a checkout — see the long note in deploy-playground.yml for why this
      # job deliberately holds no working tree.
      - name: Does this commit affect the site?
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          # `github.sha` is the right SHA only on a manual dispatch. On
          # `workflow_run` it is the default-branch tip at fire time, NOT the
          # commit the triggering run tested — with the stamp pushing ~60s after
          # every merge those are routinely different commits.
          SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # `set -e` (so a failed `gh api` fails the job) but deliberately NOT
          # `pipefail`: `grep -q` exits on the first match, which SIGPIPEs the
          # producer, and under `pipefail` that non-zero status would invert the
          # test and skip every deploy.
          set -eu
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::notice::manual dispatch — deploying regardless of changed paths"
            echo "value=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `.files` is the commit's diff against its first parent — the same
          # comparison `git diff HEAD^ HEAD` makes. It is capped at 300 entries,
          # so a larger commit is treated as "affects everything" rather than
          # silently losing the entry that would have triggered the deploy.
          resp=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}")
          count=$(printf '%s' "$resp" | jq '.files | length')
          if [ "$count" -ge 300 ]; then
            echo "::notice::commit touches >= 300 files — the API list is truncated, so deploying rather than risk a false skip"
            echo "value=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s' "$resp" | jq -r '.files[].filename' | grep -qE \
             '^(site/|vscode-bynk/syntaxes/bynk\.tmLanguage\.json$|\.github/workflows/deploy-site\.yml$|Cargo\.(toml|lock)$)|(^|/)src/.*\.rs$'; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::nothing affecting the site or the generated API docs changed — skipping the deploy"
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Build + deploy to Cloudflare Pages
    needs: decide
    if: needs.decide.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: site
    steps:
      # Gate on the secrets' presence in one tiny step whose env holds the token,
      # exposing only a boolean output. The credentials themselves are attached
      # step-level to the wrangler step that needs them (below) — never job-level,
      # so `npm ci` install scripts, the cargo doc build, and the Chromium install
      # never see the token. Before the maintainer adds the Cloudflare secrets, the
      # build still runs and the upload skips, so the workflow is green rather than
      # red on the first push.
      - name: Check for Cloudflare secrets
        id: gate
        working-directory: ${{ github.workspace }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # The exact SHA `decide` resolved and validated — never `github.sha`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.decide.outputs.sha }}
          persist-credentials: false
      # Node 22: Astro 7 floors Node at 22.12.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
      - name: Install deps
        run: npm ci
      # Generate the Rust crate API docs and stage them into the site so Astro
      # serves them verbatim at /docs/api/ (the tree is gitignored — CI-generated,
      # never committed). Built here because this is where the toolchain lives.
      # rust-cache / rust-toolchain are JS actions, so they run at the repo root
      # regardless of the job's `working-directory: site` default; the shell step
      # overrides it back to the repo root.
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Generate + stage the crate API docs
        working-directory: ${{ github.workspace }}
        run: |
          cargo doc --no-deps --workspace
          rm -rf site/public/docs/api
          mkdir -p site/public/docs/api
          cp -r target/doc/. site/public/docs/api/
          node site/scripts/build-api-index.mjs site/public/docs/api
      # The Book's ```mermaid diagrams render to inline SVG at build time via
      # rehype-mermaid, which drives a headless Chromium.
      - name: Install Chromium (mermaid)
        run: npx playwright install --with-deps chromium
      # astro build also runs Pagefind + the internal link-checker; a broken
      # in-site link fails here before anything deploys.
      - name: Build the site (astro build)
        run: npm run build
      # Single Pages project at the apex (no sandbox split — this is static
      # content, not a code-execution surface). `--branch=main` publishes to the
      # project's production deployment.
      - name: Deploy to the bynk-lang.org apex
        if: steps.gate.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.112.0 pages deploy dist --project-name=bynk-lang --branch=main
      - name: Note when deploy was skipped
        if: steps.gate.outputs.present == 'false'
        run: echo "::notice::Cloudflare secrets not set — built site/dist but skipped the upload. See site/README.md."
