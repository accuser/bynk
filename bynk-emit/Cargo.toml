[package]
name = "bynk-emit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bynk's TypeScript emission and the per-unit build sequencing (compile_project/run_checks) that drives it, atop bynk-project (discovery, the dependency graph) and bynk-check (all semantic checking)."
keywords = ["compiler", "dsl", "typescript", "codegen", "language"]
categories = ["compilers"]

[lib]
path = "src/lib.rs"

[dependencies]
# #521: bynk.toml parsing (read_project_paths). #980: also the schema
# registry (`bynk.schema.lock`), same format.
toml.workspace = true
# #980: (de)serialising the schema registry document.
serde.workspace = true
# The layers this orchestrates: syntax (AST/spans) and the checked program.
bynk-syntax.workspace = true
bynk-check.workspace = true
# P4.0 (#1113): the project model (discovery, graph, paths, consistency,
# schema-registry read/write) — this crate now depends on it rather than
# owning it directly.
bynk-project.workspace = true
