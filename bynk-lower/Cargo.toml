description = "Bynk's &CheckedProgram -> Ir lowering pass: the fn/handler/item/expression/statement constructors bynk-emit calls to build bynk-ir values. Carved out of bynk-emit alongside bynk-ir (ADR 0332's deferred split, ADR 0385's trigger)."
