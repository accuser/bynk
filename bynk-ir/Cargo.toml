[package]
name = "bynk-ir"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bynk's resolved declaration-level IR — ProtocolIr/IrHandlerKind/TypeShape/OpSig and their siblings — plus the small set of shared AST-analysis helpers both bynk-emit and bynk-lower need. Carved out of bynk-emit (ADR 0332's deferred split) once bynk-ts became a genuine second IR consumer (ADR 0385)."
keywords = ["compiler", "dsl", "ir", "language"]
categories = ["compilers"]

[lib]
path = "src/lib.rs"

[dependencies]
bynk-syntax.workspace = true
bynk-check.workspace = true
